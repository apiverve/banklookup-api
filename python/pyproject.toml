[project]
name = "apiverve-banklookup"
version = "1.2.6"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Bank Lookup is a bank and credit union lookup API covering every FDIC-insured institution ever chartered and every federally insured credit union. Search by name, FDIC certificate, NCUA charter, routing number, SWIFT code, LEI, website domain or IBAN and get the status, headquarters, regulator and identifiers, while paid plans add the successor of merged charters, failure details, the LEI, assets, deposits, members and full branch lists."
keywords = ["bank lookup api", "bank search api", "credit union lookup api", "fdic bank lookup", "bank data api"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/banklookup?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/banklookup?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/banklookup-api"
Twitter = "https://twitter.com/apivervehq"
